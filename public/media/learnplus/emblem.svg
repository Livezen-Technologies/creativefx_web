<?xml version="1.0" encoding="UTF-8"?>
<!--
  The MyLearnPlus mark on its own, without the wordmark.

  Used where the badge has to stand alone and cannot be drawn from the theme
  tokens: the favicon set, the loading screen of the standalone pages, and the
  Open Graph fallback. Everywhere inside the app the mark is inlined from
  --accent, --gold and --fg instead (see partials/logo.php), so this file
  carries the light-theme colours as literals and is deliberately the only
  place they appear twice.

  A plus, because the name is "learn plus", with four rays that turn it into a
  spark — the nod to the AI half of the catalogue without drawing a robot.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 112" width="112" height="112" role="img" aria-label="MyLearnPlus">
  <rect x="4" y="4" width="104" height="104" rx="30" fill="#F8FAFC"/>
  <rect x="14" y="14" width="84" height="84" rx="24" fill="none" stroke="#3F35C7" stroke-width="5"/>
  <g stroke="#3F35C7" stroke-width="9" stroke-linecap="round">
    <path d="M56 36v40"/>
    <path d="M36 56h40"/>
  </g>
  <g stroke="#92400E" stroke-width="5" stroke-linecap="round" opacity="0.9">
    <path d="M40.5 40.5l-6-6"/>
    <path d="M71.5 40.5l6-6"/>
    <path d="M40.5 71.5l-6 6"/>
    <path d="M71.5 71.5l6 6"/>
  </g>
</svg>
