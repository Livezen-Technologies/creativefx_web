name: Import source-site assets

# Pulls the real Magic Corn assets from the live site. This session's sandbox
# cannot reach magiccorn.lk (blocked by the environment's egress policy), but a
# GitHub runner has ordinary internet access — so the fetch happens here and the
# files land in the repository, where the deploy picks them up like any other
# committed asset.
#
#   inventory : read-only. Prints the pages' image URLs, sizes and page text so
#               the assets can be chosen before anything is committed.
#   import    : downloads the images into public/media/magiccorn/ and commits.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: inventory
        type: choice
        options: [inventory, import, probe]
      origin_host:
        description: Site hostname
        required: true
        default: magiccorn.lk
      origin_ip:
        description: Origin IP, used if the hostname will not resolve/connect
        required: false
        default: 51.89.7.73
      paths:
        description: Space-separated paths to crawl
        required: true
        default: "/ /about-us/ /our-business/ /our-locations/ /contact-us/ /shop/"
      force_origin_ip:
        description: "Send every request to origin_ip with the hostname's SNI and Host header — for testing a new server before DNS moves to it"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      scheme:
        description: "auto tries https and falls back to http; force one when you want to test that scheme specifically"
        required: false
        default: auto
        type: choice
        options: [auto, https, http]
      dest_dir:
        description: "import only: folder under public/media/ to write into"
        required: false
        default: magiccorn
      probe_pattern:
        description: "probe only: extended regex to look for in the pages and their stylesheets"
        required: false
        default: "--hero-dim"
      branch:
        description: Branch to commit imported assets to
        required: true
        default: claude/awesome-planck-01cc95

concurrency:
  group: import-assets-${{ github.event.inputs.origin_host }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    # The default workflow token is read-only, so the import's commit could not
    # be pushed. The download itself succeeded; only the push was refused.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Fetch pages
        env:
          HOSTN:    ${{ github.event.inputs.origin_host }}
          OIP:      ${{ github.event.inputs.origin_ip }}
          PATHS:    ${{ github.event.inputs.paths }}
          FORCE_IP: ${{ github.event.inputs.force_origin_ip }}
          SCHEME:   ${{ github.event.inputs.scheme }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/src
          # Prefer the hostname; fall back to the origin IP with a Host header
          # (works even when DNS points at a proxy that blocks us).
          BASE="https://${HOSTN}"
          if [ "${FORCE_IP:-false}" = "true" ]; then
            # --resolve keeps the hostname everywhere it matters — SNI, the Host
            # header, and certificate validation — while sending the packets to
            # the address given. That is what lets a new origin be checked while
            # DNS still points at the old one.
            note_ip="pinned to ${OIP}"
            CURL_EXTRA=(--resolve "${HOSTN}:443:${OIP}" --resolve "${HOSTN}:80:${OIP}" -k)
            echo "origin $note_ip"
          elif ! curl -sS -m 25 -o /tmp/src/probe.html -w '%{http_code}\n' "$BASE/" | grep -qE '^(200|30[12])$'; then
            echo "hostname fetch failed; trying origin IP ${OIP} with Host header"
            BASE="https://${OIP}"
            CURL_EXTRA=(-k -H "Host: ${HOSTN}")
          else
            CURL_EXTRA=()
          fi
          # A site whose certificate has not been issued yet still answers on
          # port 80, but on 443 nginx hands the connection to whichever vhost is
          # the default server — which does not know this hostname and returns a
          # 404. Probing https only, that reads as "the site is not there" when
          # in fact the site is fine and only the certificate is missing. So ask
          # both, and say which one answered.
          case "${SCHEME:-auto}" in
            http|https) BASE="${SCHEME}://${BASE#*://}"
                        echo "scheme forced to ${SCHEME}" ;;
            *)          for S in https http; do
                          CAND="${S}://${BASE#*://}"
                          c=$(curl -sSL -m 20 "${CURL_EXTRA[@]}" -o /dev/null -w '%{http_code}' "$CAND/" || echo 000)
                          echo "  ${CAND}/ -> $c"
                          if [ "$c" = "200" ] || [ "$c" = "301" ] || [ "$c" = "302" ]; then
                            BASE="$CAND"; break
                          fi
                        done
                        echo "using $BASE" ;;
          esac

          echo "BASE=$BASE" >> $GITHUB_ENV
          printf 'CURL_EXTRA=%s\n' "${CURL_EXTRA[*]:-}" >> $GITHUB_ENV

          for P in $PATHS; do
            NAME=$(echo "$P" | sed 's|^/||; s|/$||; s|/|_|g'); NAME=${NAME:-home}
            # "${arr[@]:-}" on an empty array expands to one empty argument,
            # which curl reads as a second URL — the page then goes to stdout
            # and the file lands empty, so every crawled path was silently
            # dropped and only the probe was ever inventoried. bash 4.4+ is
            # happy with the bare form under set -u.
            code=$(curl -sSL -m 30 "${CURL_EXTRA[@]}" -o "/tmp/src/$NAME.html" -w '%{http_code}' "$BASE$P" || echo 000)
            echo "  $P -> $code  ($(wc -c < "/tmp/src/$NAME.html" 2>/dev/null || echo 0) bytes)"
            case "$code" in 200|30[12]) ;; *) BAD="${BAD:-}$P ($code) " ;; esac
          done
          # Crawling a source site tolerates a dead path — you take what is
          # there. Probing your own site does not: a run that fetched six 404s
          # and reported success is worse than no run at all, because it looks
          # like verification. The probe step below fails on this.
          echo "FETCH_BAD=${BAD:-}" >> $GITHUB_ENV

      - name: Inventory (read-only)
        if: ${{ github.event.inputs.action == 'inventory' }}
        env:
          HOSTN: ${{ github.event.inputs.origin_host }}
        run: |
          # Read-only report: a grep that matches nothing is an answer, not a
          # failure, and the step runs under `bash -e`, so guard every pipeline.
          set -uo pipefail
          echo "===== IMAGE / MEDIA URLS ====="
          grep -rhoE '(https?:)?//[^"'"'"' )]+\.(jpe?g|png|webp|svg|gif|mp4|webm)' /tmp/src/*.html 2>/dev/null \
            | sed 's|^//|https://|' | sort -u | head -120 || true
          echo
          echo "===== RELATIVE MEDIA PATHS ====="
          grep -rhoE '"/[^"]+\.(jpe?g|png|webp|svg|gif|mp4|webm)"' /tmp/src/*.html 2>/dev/null \
            | tr -d '"' | sort -u | head -60 || true
          echo
          echo "===== VIDEO SOURCES ====="
          # The two greps above only see a URL that ends in a media extension,
          # which is blind to the two commonest ways a site actually carries a
          # film: an <iframe> to YouTube or Vimeo, and a theme that stashes the
          # file in a data- attribute for a background player. Report the markup
          # that decides playback too — autoplay, muted, loop and playsinline
          # are the difference between a film that runs and a still poster.
          for f in /tmp/src/*.html; do
            [ "$f" = "/tmp/src/probe.html" ] && continue
            echo "----- $(basename "$f") -----"
            grep -ohE '<video[^>]*>' "$f" 2>/dev/null | head -10 || true
            grep -ohE '<source[^>]*>' "$f" 2>/dev/null | head -20 || true
            grep -ohE '(www\.)?(youtube(-nocookie)?\.com|youtu\.be|vimeo\.com|player\.vimeo\.com)/[^"'"'"' <>\\]*' "$f" 2>/dev/null \
              | sort -u | head -20 || true
            grep -ohE 'data-[a-z-]*(video|mp4)[a-z-]*="[^"]*"' "$f" 2>/dev/null | sort -u | head -20 || true
          done
          echo

          echo "===== BRAND COLOURS SEEN IN INLINE CSS ====="
          grep -rhoE '#[0-9a-fA-F]{6}\b' /tmp/src/*.html 2>/dev/null | sort | uniq -c | sort -rn | head -20 || true
          echo
          echo "===== PAGE TEXT ====="
          # sed cannot do this. Two attempts proved it: matching script blocks
          # within a line misses multi-line ones, and deleting by line range
          # misses everything when the document is minified onto a few lines.
          # Either way the copy ends up buried under inline theme CSS.
          for f in /tmp/src/*.html; do
            [ "$f" = "/tmp/src/probe.html" ] && continue
            echo "----- $(basename "$f") -----"
            python3 scripts/html-to-text.py "$f" 200 || true
            echo
          done

      - name: Probe (read-only)
        if: ${{ github.event.inputs.action == 'probe' }}
        env:
          HOSTN: ${{ github.event.inputs.origin_host }}
          PAT:   ${{ github.event.inputs.probe_pattern }}
        run: |
          # Says what a given site is actually serving right now. Follows each
          # page's own stylesheets, because the interesting differences between
          # two builds live in the CSS, not the markup.
          set -uo pipefail
          for f in /tmp/src/*.html; do
            [ "$f" = "/tmp/src/probe.html" ] && continue
            echo "===== $(basename "$f") — $(wc -c < "$f") bytes ====="
            echo "-- pattern in page:"
            grep -ohE ".{0,60}${PAT}.{0,60}" "$f" 2>/dev/null | head -5 || echo "  (not found)"
            # A page that 404s is an answer, not a reason to abandon the
            # remaining pages. pipefail makes a grep that matches nothing fail
            # the whole pipeline, and bash -e then kills the step — so the one
            # empty page took the report down with it.
            grep -ohE 'href="[^"]+\.css[^"]*"' "$f" 2>/dev/null | sed -E 's/^href="//; s/"$//' | sort -u > /tmp/css.txt || true
            while read -r CSS; do
              case "$CSS" in
                //*) URL="https:$CSS" ;;
                /*)  URL="$BASE$CSS" ;;
                http*) URL="$CSS" ;;
                *)   URL="$BASE/$CSS" ;;
              esac
              OUT=/tmp/probe.css
              code=$(curl -sSL -m 30 -o "$OUT" -w '%{http_code}' "$URL" || echo 000)
              echo "-- $URL -> $code ($(wc -c < "$OUT" 2>/dev/null || echo 0) bytes)"
              grep -ohE ".{0,80}${PAT}.{0,80}" "$OUT" | head -5 || echo "   (pattern not in this stylesheet)"
            done < /tmp/css.txt

            echo "-- media referenced by this page, with the status it returns:"
            # esc() writes attributes HTML-escaped, so a src can arrive as
            # &#x2F;media&#x2F;… — requesting that literally returns 400 and
            # reads like a broken image when nothing is wrong. Decode first.
            #
            # Cache-busting then put a ?v=<size> on every media URL, which esc()
            # writes as &#x3F;v&#x3D;… — so a pattern anchored on the extension
            # touching the closing quote matched nothing that carried a version.
            # That is every photograph on the site: this report went on printing
            # one unversioned favicon per page and looking like it had checked.
            grep -ohE '(src|href)="[^"]+\.(jpe?g|png|webp|svg|gif|mp4|webm)([?&#][^"]*)?"' "$f" \
              | sed -E 's/^(src|href)="//; s/"$//' \
              | sed -e 's/&#x2F;/\//g' -e 's/&#47;/\//g' \
                    -e 's/&#x3F;/?/g'  -e 's/&#x3D;/=/g' -e 's/&amp;/\&/g' \
              | sort -u | head -40 > /tmp/media.txt || true
            while read -r M; do
              case "$M" in
                http*) MU="$M" ;;
                //*)   MU="https:$M" ;;
                /*)    MU="$BASE$M" ;;
                *)     MU="$BASE/$M" ;;
              esac
              INFO=$(curl -sSL -m 20 -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$MU" || echo '000 - 0')
              printf '   %-40s %s\n' "$M" "$INFO"
            done < /tmp/media.txt
          done

          if [ -n "${FETCH_BAD:-}" ]; then
            echo
            echo "::error::the site did not serve these paths: ${FETCH_BAD}"
            echo "Nothing above was read from a real page, so this run verifies nothing."
            exit 1
          fi

      - name: Import images and commit
        if: ${{ github.event.inputs.action == 'import' }}
        env:
          HOSTN: ${{ github.event.inputs.origin_host }}
          DEST_DIR: ${{ github.event.inputs.dest_dir }}
        run: |
          set -uo pipefail
          # One brand per folder. This was pinned to magiccorn, which would have
          # dropped a second site's photography in among the first site's.
          DEST="public/media/${DEST_DIR:-magiccorn}"
          mkdir -p "$DEST"
          # Absolute + relative media references, normalised to absolute URLs.
          { grep -rhoE '(https?:)?//[^"'"'"' )]+\.(jpe?g|png|webp|svg|gif|mp4|webm)' /tmp/src/*.html 2>/dev/null | sed 's|^//|https://|'
            grep -rhoE '"/[^"]+\.(jpe?g|png|webp|svg|gif|mp4|webm)"' /tmp/src/*.html 2>/dev/null | tr -d '"' | sed "s|^|https://${HOSTN}|"
          } | grep -iE "${HOSTN}" | sort -u > /tmp/urls.txt
          echo "candidate assets: $(wc -l < /tmp/urls.txt)"

          # WordPress only links resized derivatives for some images. Recover the
          # full-size original by stripping the -WxH suffix and adding it to the list.
          sed -E 's/-[0-9]+x[0-9]+(\.[a-zA-Z0-9]+)$/\1/' /tmp/urls.txt | sort -u >> /tmp/urls.txt
          sort -u -o /tmp/urls.txt /tmp/urls.txt
          echo "with originals recovered: $(wc -l < /tmp/urls.txt)"

          n=0
          while read -r U; do
            [ -z "$U" ] && continue
            FN=$(basename "${U%%\?*}")
            # Skip the resized copies themselves — the original is in the list now.
            case "$FN" in *-[0-9][0-9]*x[0-9][0-9]*.*) continue;; esac
            # Never overwrite a file already in the repository. Imported assets
            # get worked on after they land — relit, cut out, recompressed — and
            # a later import of the same page would silently put the untouched
            # original back. That happened: it reverted the relit home hero and
            # the cleaned-up product cut-out in one run. Fetching a file that is
            # already here has no value anyway; the point is to bring in new ones.
            if [ -e "$DEST/$FN" ]; then
              printf '  %-52s %8s\n' "$FN" "already here — skipped"
              continue
            fi
            curl -sSL -m 60 --create-dirs -o "$DEST/$FN" "$U" || continue
            SZ=$(wc -c < "$DEST/$FN")
            # Judging "is this an image?" by size does not work. A WordPress 404
            # page is about 70 KB, so it sailed past a 1 KB floor and got
            # committed as a .png — nine of them in one run, including the logo
            # and every favicon. They serve as 200s and fail only in the browser,
            # which is the worst place to find out. Ask what the bytes actually
            # are instead.
            KIND=$(file -b --mime-type "$DEST/$FN" 2>/dev/null || echo unknown)
            case "$KIND" in
              image/*|video/*) : ;;
              *) printf '  %-52s %s\n' "$FN" "not an image ($KIND) — discarded"
                 rm -f "$DEST/$FN"; continue;;
            esac
            if [ "$SZ" -lt 1000 ]; then rm -f "$DEST/$FN"; continue; fi
            n=$((n+1)); printf '  %-52s %8s bytes\n' "$FN" "$SZ"
          done < /tmp/urls.txt
          echo "imported: $n"
          # `ls | head` closes the pipe early, ls takes SIGPIPE, and pipefail
          # turns that into a failed step — after every file has downloaded
          # successfully. The commit step is then skipped and the whole import
          # is thrown away because the summary listing was too long.
          ls -la "$DEST" | head -40 || true

      - name: Commit
        if: ${{ github.event.inputs.action == 'import' }}
        env:
          HOSTN:    ${{ github.event.inputs.origin_host }}
          DEST_DIR: ${{ github.event.inputs.dest_dir }}
        run: |
          set -e
          # This path has to follow dest_dir. It did not, so an import that
          # downloaded every file then staged a folder it had not written to
          # and reported "nothing new to commit" — a clean, successful, empty run.
          DEST="public/media/${DEST_DIR:-magiccorn}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit \
            -m "Import assets from ${HOSTN}" \
            -m "Fetched on a runner because this session's sandbox cannot reach ${HOSTN} — its egress policy blocks every outbound host, so the files could not be pulled locally. Full-size originals only; WordPress's resized derivatives are skipped, and any name already in the repository is left alone."
          git push origin HEAD:${{ github.event.inputs.branch }}
