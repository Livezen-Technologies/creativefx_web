name: Import source-site assets

# Pulls the real Magic Corn assets from the live site. This session's sandbox
# cannot reach magiccorn.lk (blocked by the environment's egress policy), but a
# GitHub runner has ordinary internet access — so the fetch happens here and the
# files land in the repository, where the deploy picks them up like any other
# committed asset.
#
#   inventory : read-only. Prints the pages' image URLs, sizes and page text so
#               the assets can be chosen before anything is committed.
#   import    : downloads the images into public/media/magiccorn/ and commits.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        default: inventory
        type: choice
        options: [inventory, import, probe]
      origin_host:
        description: Site hostname
        required: true
        default: magiccorn.lk
      origin_ip:
        description: Origin IP, used if the hostname will not resolve/connect
        required: false
        default: 51.89.7.73
      paths:
        description: Space-separated paths to crawl
        required: true
        default: "/ /about-us/ /our-business/ /our-locations/ /contact-us/ /shop/"
      probe_pattern:
        description: "probe only: extended regex to look for in the pages and their stylesheets"
        required: false
        default: "--hero-dim"
      branch:
        description: Branch to commit imported assets to
        required: true
        default: claude/awesome-planck-01cc95

concurrency:
  group: import-assets-${{ github.event.inputs.origin_host }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    # The default workflow token is read-only, so the import's commit could not
    # be pushed. The download itself succeeded; only the push was refused.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Fetch pages
        env:
          HOSTN: ${{ github.event.inputs.origin_host }}
          OIP:   ${{ github.event.inputs.origin_ip }}
          PATHS: ${{ github.event.inputs.paths }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/src
          # Prefer the hostname; fall back to the origin IP with a Host header
          # (works even when DNS points at a proxy that blocks us).
          BASE="https://${HOSTN}"
          if ! curl -sS -m 25 -o /tmp/src/probe.html -w '%{http_code}\n' "$BASE/" | grep -qE '^(200|30[12])$'; then
            echo "hostname fetch failed; trying origin IP ${OIP} with Host header"
            BASE="https://${OIP}"
            CURL_EXTRA=(-k -H "Host: ${HOSTN}")
          else
            CURL_EXTRA=()
          fi
          echo "BASE=$BASE" >> $GITHUB_ENV
          printf 'CURL_EXTRA=%s\n' "${CURL_EXTRA[*]:-}" >> $GITHUB_ENV

          for P in $PATHS; do
            NAME=$(echo "$P" | sed 's|^/||; s|/$||; s|/|_|g'); NAME=${NAME:-home}
            # "${arr[@]:-}" on an empty array expands to one empty argument,
            # which curl reads as a second URL — the page then goes to stdout
            # and the file lands empty, so every crawled path was silently
            # dropped and only the probe was ever inventoried. bash 4.4+ is
            # happy with the bare form under set -u.
            code=$(curl -sSL -m 30 "${CURL_EXTRA[@]}" -o "/tmp/src/$NAME.html" -w '%{http_code}' "$BASE$P" || echo 000)
            echo "  $P -> $code  ($(wc -c < "/tmp/src/$NAME.html" 2>/dev/null || echo 0) bytes)"
          done

      - name: Inventory (read-only)
        if: ${{ github.event.inputs.action == 'inventory' }}
        env:
          HOSTN: ${{ github.event.inputs.origin_host }}
        run: |
          # Read-only report: a grep that matches nothing is an answer, not a
          # failure, and the step runs under `bash -e`, so guard every pipeline.
          set -uo pipefail
          echo "===== IMAGE / MEDIA URLS ====="
          grep -rhoE '(https?:)?//[^"'"'"' )]+\.(jpe?g|png|webp|svg|gif|mp4|webm)' /tmp/src/*.html 2>/dev/null \
            | sed 's|^//|https://|' | sort -u | head -120 || true
          echo
          echo "===== RELATIVE MEDIA PATHS ====="
          grep -rhoE '"/[^"]+\.(jpe?g|png|webp|svg|gif|mp4|webm)"' /tmp/src/*.html 2>/dev/null \
            | tr -d '"' | sort -u | head -60 || true
          echo
          echo "===== BRAND COLOURS SEEN IN INLINE CSS ====="
          grep -rhoE '#[0-9a-fA-F]{6}\b' /tmp/src/*.html 2>/dev/null | sort | uniq -c | sort -rn | head -20 || true
          echo
          echo "===== PAGE TEXT (first 120 lines each) ====="
          for f in /tmp/src/*.html; do
            [ "$f" = "/tmp/src/probe.html" ] && continue
            echo "----- $(basename "$f") -----"
            sed -e 's/<script[^>]*>.*<\/script>//g' -e 's/<style[^>]*>.*<\/style>//g' "$f" \
              | sed -e 's/<[^>]*>/ /g' | tr -s ' \n' ' \n' | grep -v '^\s*$' | head -120 || true
          done

      - name: Probe (read-only)
        if: ${{ github.event.inputs.action == 'probe' }}
        env:
          HOSTN: ${{ github.event.inputs.origin_host }}
          PAT:   ${{ github.event.inputs.probe_pattern }}
        run: |
          # Says what a given site is actually serving right now. Follows each
          # page's own stylesheets, because the interesting differences between
          # two builds live in the CSS, not the markup.
          set -uo pipefail
          for f in /tmp/src/*.html; do
            [ "$f" = "/tmp/src/probe.html" ] && continue
            echo "===== $(basename "$f") — $(wc -c < "$f") bytes ====="
            echo "-- pattern in page:"
            grep -ohE ".{0,60}${PAT}.{0,60}" "$f" | head -5 || echo "  (not found)"
            grep -ohE 'href="[^"]+\.css[^"]*"' "$f" | sed -E 's/^href="//; s/"$//' | sort -u | while read -r CSS; do
              case "$CSS" in
                //*) URL="https:$CSS" ;;
                /*)  URL="$BASE$CSS" ;;
                http*) URL="$CSS" ;;
                *)   URL="$BASE/$CSS" ;;
              esac
              OUT=/tmp/probe.css
              code=$(curl -sSL -m 30 -o "$OUT" -w '%{http_code}' "$URL" || echo 000)
              echo "-- $URL -> $code ($(wc -c < "$OUT" 2>/dev/null || echo 0) bytes)"
              grep -ohE ".{0,80}${PAT}.{0,80}" "$OUT" | head -5 || echo "   (pattern not in this stylesheet)"
            done
          done

      - name: Import images and commit
        if: ${{ github.event.inputs.action == 'import' }}
        env:
          HOSTN: ${{ github.event.inputs.origin_host }}
        run: |
          set -uo pipefail
          DEST=public/media/magiccorn
          mkdir -p "$DEST"
          # Absolute + relative media references, normalised to absolute URLs.
          { grep -rhoE '(https?:)?//[^"'"'"' )]+\.(jpe?g|png|webp|svg|gif|mp4|webm)' /tmp/src/*.html 2>/dev/null | sed 's|^//|https://|'
            grep -rhoE '"/[^"]+\.(jpe?g|png|webp|svg|gif|mp4|webm)"' /tmp/src/*.html 2>/dev/null | tr -d '"' | sed "s|^|https://${HOSTN}|"
          } | grep -iE "${HOSTN}" | sort -u > /tmp/urls.txt
          echo "candidate assets: $(wc -l < /tmp/urls.txt)"

          # WordPress only links resized derivatives for some images. Recover the
          # full-size original by stripping the -WxH suffix and adding it to the list.
          sed -E 's/-[0-9]+x[0-9]+(\.[a-zA-Z0-9]+)$/\1/' /tmp/urls.txt | sort -u >> /tmp/urls.txt
          sort -u -o /tmp/urls.txt /tmp/urls.txt
          echo "with originals recovered: $(wc -l < /tmp/urls.txt)"

          n=0
          while read -r U; do
            [ -z "$U" ] && continue
            FN=$(basename "${U%%\?*}")
            # Skip the resized copies themselves — the original is in the list now.
            case "$FN" in *-[0-9][0-9]*x[0-9][0-9]*.*) continue;; esac
            curl -sSL -m 60 --create-dirs -o "$DEST/$FN" "$U" || continue
            SZ=$(wc -c < "$DEST/$FN")
            # Drop anything that came back as an error page rather than an image.
            if [ "$SZ" -lt 1000 ]; then rm -f "$DEST/$FN"; continue; fi
            n=$((n+1)); printf '  %-52s %8s bytes\n' "$FN" "$SZ"
          done < /tmp/urls.txt
          echo "imported: $n"
          ls -la "$DEST" | head -40

      - name: Commit
        if: ${{ github.event.inputs.action == 'import' }}
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/media/magiccorn
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit \
            -m "Import Magic Corn assets from the live site" \
            -m "Fetched on a runner because this session's sandbox cannot reach magiccorn.lk — its egress policy blocks every outbound host, so the files could not be pulled locally. Full-size originals only; WordPress's resized derivatives are skipped."
          git push origin HEAD:${{ github.event.inputs.branch }}
