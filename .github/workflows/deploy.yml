name: Deploy (norlankamfg.livezencloud.com)

# Manual trigger only — never auto-deploys on push.
# Runs deploy/setup.sh on the server FROM GitHub's runner (which can reach it).
#
# Credentials resolve in this order:  repo secret  ->  dispatch input.
# Preferred: set repository secrets (Settings → Secrets and variables → Actions)
#   DEPLOY_HOST      = 178.105.165.144
#   DEPLOY_USER      = root            (or a sudo-capable user)
#   DEPLOY_PASSWORD  = <server password>     (prefer DEPLOY_SSH_KEY instead)
#   DEPLOY_SSH_KEY   = <private key>   (optional; used instead of the password)
# Fallback: pass host/user/password as workflow inputs when dispatching (handy
# for a one-off deploy before secrets are configured). Inputs are recorded in
# the run, so rotate any password passed this way afterwards.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        default: claude/awesome-planck-01cc95
        required: true
      deploy_host:
        description: Server host/IP (overrides DEPLOY_HOST secret)
        required: false
        default: ''
      deploy_user:
        description: SSH user (overrides DEPLOY_USER secret)
        required: false
        default: ''
      deploy_password:
        description: SSH password (overrides DEPLOY_PASSWORD secret; recorded in run — rotate after)
        required: false
        default: ''

concurrency:
  group: deploy-norlankamfg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || github.event.inputs.deploy_host }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || github.event.inputs.deploy_user }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || github.event.inputs.deploy_password }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Mask deploy password in logs
        run: |
          if [ -n "${DEPLOY_PASSWORD:-}" ]; then echo "::add-mask::${DEPLOY_PASSWORD}"; fi
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::error::No DEPLOY_HOST — set the DEPLOY_HOST secret or pass deploy_host input."; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Copy bootstrap script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          source: deploy/setup.sh
          target: /tmp/norlanka-bootstrap

      - name: Run setup.sh on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          # github.token clones the (private) repo from the server during the run.
          script: |
            set -e
            export REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            export BRANCH="${{ github.event.inputs.branch }}"
            export ASSUME_YES=1
            bash /tmp/norlanka-bootstrap/deploy/setup.sh
            rm -f /tmp/norlanka-bootstrap/deploy/setup.sh
