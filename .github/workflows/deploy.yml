name: Deploy

# Manual trigger only — never auto-deploys on push.
# Runs deploy/setup.sh on the server FROM GitHub's runner (which can reach it).
#
# Credentials resolve in this order:  repo secret  ->  dispatch input.
# Preferred: set repository secrets (Settings → Secrets and variables → Actions)
#   DEPLOY_HOST      = 178.105.165.144
#   DEPLOY_USER      = root            (or a sudo-capable user)
#   DEPLOY_PASSWORD  = <server password>     (prefer DEPLOY_SSH_KEY instead)
#   DEPLOY_SSH_KEY   = <private key>   (optional; used instead of the password)
# Fallback: pass host/user/password as workflow inputs when dispatching (handy
# for a one-off deploy before secrets are configured). Inputs are recorded in
# the run, so rotate any password passed this way afterwards.
#
# Deploying ANOTHER site: set domain, app_dir and db_name together. They default
# to this branch's own site, and leaving one at its default would point the new
# site at this install's directory or database.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy
        default: learnplus
        required: true
      deploy_host:
        description: Server host/IP (overrides DEPLOY_HOST secret)
        required: false
        default: ''
      deploy_user:
        description: SSH user (overrides DEPLOY_USER secret)
        required: false
        default: ''
      deploy_password:
        description: SSH password (overrides DEPLOY_PASSWORD secret; recorded in run — rotate after)
        required: false
        default: ''
      domain:
        description: Site domain (vhost server_name and app.baseURL)
        required: true
        default: learnplus.livezencloud.com
      app_dir:
        description: Install directory on the server
        required: true
        default: /var/www/learnplus
      db_name:
        description: MySQL database and user name
        required: true
        default: learnplus_prod

# Per-domain, so deploying one site never queues behind another.
concurrency:
  group: deploy-${{ github.event.inputs.domain }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || github.event.inputs.deploy_host }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || github.event.inputs.deploy_user }}
      DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD || github.event.inputs.deploy_password }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Mask deploy password in logs
        run: |
          if [ -n "${DEPLOY_PASSWORD:-}" ]; then echo "::add-mask::${DEPLOY_PASSWORD}"; fi
          if [ -z "${DEPLOY_HOST:-}" ]; then
            echo "::error::No DEPLOY_HOST — set the DEPLOY_HOST secret or pass deploy_host input."; exit 1
          fi

      # Explicitly the branch being deployed. Without a ref this checks out
      # whatever ref the workflow was dispatched from, so dispatching from main
      # with branch=learnplus would copy main's setup.sh to the server and run
      # it against the learnplus checkout — two different versions of the deploy
      # in one run, and the failure looks like a code bug rather than a
      # workflow one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}


      - name: Copy bootstrap script to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          source: deploy/setup.sh
          target: /tmp/deploy-${{ github.event.inputs.domain }}

      - name: Run setup.sh on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          password: ${{ env.DEPLOY_PASSWORD }}
          key: ${{ env.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          envs: DEPLOY_PASSWORD
          # github.token clones the (private) repo from the server during the run.
          script: |
            set -e
            # Per-domain, because concurrency is grouped per domain: two
            # deploys for two sites are allowed to run at once, and a shared
            # path means each one reads and then deletes the other's script.
            BOOT=/tmp/deploy-${{ github.event.inputs.domain }}/deploy/setup.sh
            REPO_URL="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            BRANCH="${{ github.event.inputs.branch }}"
            DOMAIN="${{ github.event.inputs.domain }}"
            APP_DIR="${{ github.event.inputs.app_dir }}"
            DB_NAME="${{ github.event.inputs.db_name }}"
            # setup.sh must run as root. Log in as a normal user (ubuntu, debian,
            # admin…) and it dies on its own id check, so escalate here. Values go
            # on sudo's command line rather than via -E: preserving the whole
            # environment needs SETENV, which a default sudoers does not grant.
            VARS="REPO_URL=$REPO_URL BRANCH=$BRANCH DOMAIN=$DOMAIN APP_DIR=$APP_DIR DB_NAME=$DB_NAME DB_USER=$DB_NAME ASSUME_YES=1"
            if [ "$(id -u)" -eq 0 ]; then
              env $VARS bash "$BOOT"
            elif sudo -n true 2>/dev/null; then
              sudo $VARS bash "$BOOT"
            else
              # sudo wants a password and there is no TTY — feed it on stdin.
              printf '%s\n' "$DEPLOY_PASSWORD" | sudo -S -p '' $VARS bash "$BOOT"
            fi
            rm -rf "$(dirname "$(dirname "$BOOT")")"
