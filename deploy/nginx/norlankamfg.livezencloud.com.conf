# Norlanka — Nginx server block (scoped to THIS domain only).
# Placeholders {{APP_DIR}} and {{PHP_FPM_SOCK}} are filled in by deploy/setup.sh.
# This file is installed as its own site; it never edits other vhosts.
#
# TLS: a Let's Encrypt cert for this domain already exists at
# /etc/letsencrypt/live/norlankamfg.livezencloud.com/. This vhost wires it into
# its own :443 server block (name-based — it is NOT the 443 default_server, so
# other domains on this box keep serving their own certs untouched).

# :80 — redirect to HTTPS. certbot's nginx authenticator handles ACME challenges
# during renewal by injecting its own temporary location, so a plain redirect is
# safe here.
server {
    listen 80;
    listen [::]:80;
    server_name norlankamfg.livezencloud.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# :443 — the application over TLS.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name norlankamfg.livezencloud.com;

    ssl_certificate     /etc/letsencrypt/live/norlankamfg.livezencloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/norlankamfg.livezencloud.com/privkey.pem;
    # Inlined modern TLS settings (no external include — keeps `nginx -t` from
    # depending on certbot's options file existing).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:norlanka_ssl:10m;
    ssl_session_timeout 1d;

    root {{APP_DIR}}/public;
    index index.php;

    # Cap request body for media uploads.
    client_max_body_size 64M;

    # Clean URLs -> front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:{{PHP_FPM_SOCK}};
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # TLS terminates here, so tell the app the request is secure.
        fastcgi_param HTTPS on;
    }

    # Long-cache the hashed Vite build assets.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static media.
    location /media/ {
        expires 30d;
        try_files $uri =404;
    }

    # Hide dotfiles and sensitive paths.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(app|system|writable|vendor|tests|deploy)/ { deny all; }

    access_log /var/log/nginx/norlankamfg.access.log;
    error_log  /var/log/nginx/norlankamfg.error.log;
}
