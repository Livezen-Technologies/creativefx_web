# Norlanka — Nginx server block (scoped to THIS domain only).
# Placeholders {{APP_DIR}} and {{PHP_FPM_SOCK}} are filled in by deploy/setup.sh.
# This file is installed as its own site; it never edits other vhosts.

server {
    listen 80;
    listen [::]:80;
    server_name norlankamfg.livezencloud.com;

    root {{APP_DIR}}/public;
    index index.php;

    # Cap request body for media uploads.
    client_max_body_size 64M;

    # Clean URLs -> front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:{{PHP_FPM_SOCK}};
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Trust Cloudflare's forwarded scheme so the app builds https URLs.
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
    }

    # Long-cache the hashed Vite build assets.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Static media.
    location /media/ {
        expires 30d;
        try_files $uri =404;
    }

    # Hide dotfiles and sensitive paths.
    location ~ /\.(?!well-known) { deny all; }
    location ~* /(app|system|writable|vendor|tests|deploy)/ { deny all; }

    access_log /var/log/nginx/norlankamfg.access.log;
    error_log  /var/log/nginx/norlankamfg.error.log;
}

# After TLS is in place at the origin (certbot or a Cloudflare Origin Cert),
# certbot --nginx will add the matching listen 443 block automatically, or add
# it manually. Until then Cloudflare can serve TLS to visitors over this :80
# origin (set Cloudflare SSL mode to "Full" once the origin has a certificate).
