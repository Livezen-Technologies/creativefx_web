# Norlanka Web — local/staging stack.
# Quick start:
#   cp .env.example .env   # then set the MySQL (Option B) block + key:generate
#   docker compose up -d --build
#   docker compose exec app php spark migrate --all
#   docker compose exec app php spark db:seed "Modules\Core\Database\Seeds\DatabaseSeeder"
#   npm install && npm run build      # build frontend assets on the host
#   open http://localhost:8080/

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
      - redis
    environment:
      - CI_ENVIRONMENT=development

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  mysql:
    image: mysql:8
    command: --default-authentication-plugin=caching_sha2_password
    environment:
      MYSQL_DATABASE: norlanka
      MYSQL_USER: norlanka
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # Meilisearch — optional (site search). Uncomment to enable.
  # meilisearch:
  #   image: getmeili/meilisearch:v1.8
  #   environment:
  #     MEILI_MASTER_KEY: change-me-master-key
  #   ports:
  #     - "7700:7700"
  #   volumes:
  #     - meili_data:/meili_data

volumes:
  mysql_data:
  # meili_data:
